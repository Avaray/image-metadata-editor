name: Release

on:
  push:
    tags:
      - "v*" # Trigger on version tags, e.g., v1.0.0, v0.1.0

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            executable_name: mex
            asset_name: mex-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable_name: mex.exe
            asset_name: mex-windows-amd64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary for upload
        shell: bash
        run: |
          mv target/${{ matrix.target }}/release/${{ matrix.executable_name }} target/${{ matrix.target }}/release/${{ matrix.asset_name }}

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v3
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.asset_name }}
          generate_release_notes: true
