name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for manual release (e.g., v0.1.0-test)'
        required: true
        type: string
      full_publish:
        description: 'Perform full publication (crates.io + npm)'
        required: false
        type: boolean
        default: false
      build_linux:
        description: 'Build Linux binary (x86_64)'
        required: false
        type: boolean
        default: true
      build_linux_arm:
        description: 'Build Linux ARM binaries (arm64, armv7)'
        required: false
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS binaries (arm64, x86_64)'
        required: false
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows binary (x86_64)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      is_new_version: ${{ steps.check.outputs.is_new_version }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "is_new_version=true" >> "$GITHUB_OUTPUT"
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(grep '^version = ' Cargo.toml | head -1 | awk -F '"' '{print $2}')
          [ -n "$VERSION" ] || { echo "Failed to read version from Cargo.toml"; exit 1; }
          echo "Cargo.toml version: $VERSION"

          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null || rc=$?

          if [ "$rc" -eq 0 ]; then
            echo "Tag v$VERSION already exists."
            echo "is_new_version=false" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 2 ]; then
            echo "Tag v$VERSION does not exist. Proceeding with release..."
            echo "is_new_version=true" >> "$GITHUB_OUTPUT"
            echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "git ls-remote failed (exit $rc)"
            exit 1
          fi

  build-linux:
    name: Build Linux (x86_64-musl)
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.is_new_version == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_linux)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Rename binary for upload
        run: mv target/x86_64-unknown-linux-musl/release/ime target/x86_64-unknown-linux-musl/release/ime-linux-amd64

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ime-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/ime-linux-amd64

  build-linux-arm:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.is_new_version == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_linux_arm)
    strategy:
      matrix:
        include:
          # Raspberry Pi 3/4/5 running 64-bit Raspberry Pi OS
          - target: aarch64-unknown-linux-musl
            artifact: ime-linux-arm64
          # Raspberry Pi 2/3/4 running 32-bit Raspberry Pi OS
          - target: armv7-unknown-linux-musleabihf
            artifact: ime-linux-armv7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Cache pip packages (cargo-zigbuild / ziglang)
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: cargo-zigbuild-pip-v1

      - name: Install cargo-zigbuild (bundles Zig via pip)
        run: pip install cargo-zigbuild --break-system-packages

      - name: Build binary
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Rename binary for upload
        run: mv target/${{ matrix.target }}/release/ime target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-latest
    needs: check-version
    if: needs.check-version.outputs.is_new_version == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_macos)
    strategy:
      matrix:
        include:
          # Apple Silicon (M1 and newer)
          - target: aarch64-apple-darwin
            artifact: ime-macos-arm64
          # Intel Macs
          - target: x86_64-apple-darwin
            artifact: ime-macos-amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary for upload
        run: mv target/${{ matrix.target }}/release/ime target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  build-windows:
    name: Build Windows (x86_64-msvc)
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.is_new_version == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_windows)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Cache cargo-xwin binary
        id: cargo-xwin-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-xwin
          key: cargo-xwin-bin-v1

      - name: Install cargo-xwin
        if: steps.cargo-xwin-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-xwin

      - name: Cache Windows SDK/CRT (xwin)
        uses: actions/cache@v6
        with:
          path: /home/runner/.xwin-cache
          key: xwin-sdk-v1

      - name: Build binary
        env:
          XWIN_CACHE_DIR: /home/runner/.xwin-cache
        run: cargo xwin build --release --target x86_64-pc-windows-msvc

      - name: Rename binary for upload
        run: mv target/x86_64-pc-windows-msvc/release/ime.exe target/x86_64-pc-windows-msvc/release/ime-windows-amd64.exe

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ime-windows-amd64.exe
          path: target/x86_64-pc-windows-msvc/release/ime-windows-amd64.exe

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check-version, build-linux, build-linux-arm, build-macos, build-windows]
    if: needs.check-version.outputs.is_new_version == 'true' && !failure() && !cancelled()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Linux binary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ime-linux-amd64
          path: dist/

      - name: Download Linux arm64 binary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ime-linux-arm64
          path: dist/

      - name: Download Linux armv7 binary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ime-linux-armv7
          path: dist/

      - name: Download macOS arm64 binary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ime-macos-arm64
          path: dist/

      - name: Download macOS amd64 binary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ime-macos-amd64
          path: dist/

      - name: Download Windows binary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ime-windows-amd64.exe
          path: dist/

      - name: Calculate SHA-256 hashes
        id: hashes
        run: |
          echo "hashes<<EOF" >> $GITHUB_OUTPUT
          echo "| File | SHA-256 |" >> $GITHUB_OUTPUT
          echo "| --- | --- |" >> $GITHUB_OUTPUT
          for file in dist/*; do
            if [ -f "$file" ]; then
              sha256=$(sha256sum "$file" | awk '{print $1}')
              basename=$(basename "$file")
              echo "| \`$basename\` | **$sha256** |" >> $GITHUB_OUTPUT
            fi
          done
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate commit changelog
        id: changelog
        shell: bash
        run: |
          TARGET_TAG="${{ needs.check-version.outputs.version }}"
          
          # Find previous tag matching strictly "vX.Y.Z" format (e.g. v1.0.0), ignoring suffixes like v1.0.0-test
          PREV_TAG=$(git tag -l --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TARGET_TAG}$" | head -n 1)
          
          if [ -n "$PREV_TAG" ]; then
            echo "Fetching commits between $PREV_TAG and HEAD"
            COMMIT_RANGE="${PREV_TAG}..HEAD"
          else
            echo "No previous release tag found. Fetching full history."
            COMMIT_RANGE="HEAD"
          fi
          
          # Filter Conventional Commits (feat, fix, perf, refactor, revert)
          CHANGES=$(git log $COMMIT_RANGE --pretty=format:"- %s (%h)" | grep -iE "^- (feat|fix|perf|refactor|revert)(\([^\)]+\))?:" || echo "- No significant changes in this release.")
          
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "notes<<$EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          files: dist/*
          generate_release_notes: false
          body: |
            ## 🚀 What's Changed

            ${{ steps.changelog.outputs.notes }}

            ---
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ needs.check-version.outputs.version }}

            ## 🔒 SHA-256 Checksums

            ${{ steps.hashes.outputs.hashes }}

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [check-version, build-linux, build-linux-arm, build-macos, build-windows]
    if: needs.check-version.outputs.is_new_version == 'true' && !failure() && !cancelled() && (github.event_name != 'workflow_dispatch' || github.event.inputs.full_publish == 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl
          save-if: false

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [check-version, build-linux, build-linux-arm, build-macos, build-windows]
    if: needs.check-version.outputs.is_new_version == 'true' && !failure() && !cancelled() && (github.event_name != 'workflow_dispatch' || github.event.inputs.full_publish == 'true')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Sync README and LICENSE to npm package
        run: |
          cp README.md npm/ime-cli/README.md
          cp LICENSE npm/ime-cli/LICENSE

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download Linux binary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ime-linux-amd64
          path: npm/ime-linux-x64/

      - name: Download Linux arm64 binary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ime-linux-arm64
          path: npm/ime-linux-arm64/

      - name: Download Linux armv7 binary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ime-linux-armv7
          path: npm/ime-linux-armv7/

      - name: Download macOS arm64 binary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ime-macos-arm64
          path: npm/ime-macos-arm64/

      - name: Download macOS amd64 binary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ime-macos-amd64
          path: npm/ime-macos-x64/

      - name: Download Windows binary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ime-windows-amd64.exe
          path: npm/ime-win32-x64/

      - name: Prepare binaries and versions
        env:
          TAG_NAME: ${{ needs.check-version.outputs.version }}
        run: |
          # Linux x64
          if [ -f npm/ime-linux-x64/ime-linux-amd64 ]; then
            mv npm/ime-linux-x64/ime-linux-amd64 npm/ime-linux-x64/ime
            chmod +x npm/ime-linux-x64/ime
          fi
          # Linux ARM64
          if [ -f npm/ime-linux-arm64/ime-linux-arm64 ]; then
            mv npm/ime-linux-arm64/ime-linux-arm64 npm/ime-linux-arm64/ime
            chmod +x npm/ime-linux-arm64/ime
          fi
          # Linux ARMv7
          if [ -f npm/ime-linux-armv7/ime-linux-armv7 ]; then
            mv npm/ime-linux-armv7/ime-linux-armv7 npm/ime-linux-armv7/ime
            chmod +x npm/ime-linux-armv7/ime
          fi
          # macOS ARM64
          if [ -f npm/ime-macos-arm64/ime-macos-arm64 ]; then
            mv npm/ime-macos-arm64/ime-macos-arm64 npm/ime-macos-arm64/ime
            chmod +x npm/ime-macos-arm64/ime
          fi
          # macOS x64
          if [ -f npm/ime-macos-x64/ime-macos-amd64 ]; then
            mv npm/ime-macos-x64/ime-macos-amd64 npm/ime-macos-x64/ime
            chmod +x npm/ime-macos-x64/ime
          fi
          # Windows x64
          if [ -f npm/ime-win32-x64/ime-windows-amd64.exe ]; then
            mv npm/ime-win32-x64/ime-windows-amd64.exe npm/ime-win32-x64/ime.exe
          fi

          VERSION=${TAG_NAME#v}

          # Update version field in every npm package
          for pkg in npm/*/package.json; do
            tmp=$(mktemp)
            jq ".version = \"$VERSION\"" "$pkg" > "$tmp" && mv "$tmp" "$pkg"
          done

      - name: Publish Linux x64 Package
        if: hashFiles('npm/ime-linux-x64/ime') != ''
        run: npm publish --provenance --access public
        working-directory: npm/ime-linux-x64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Linux ARM64 Package
        if: hashFiles('npm/ime-linux-arm64/ime') != ''
        run: npm publish --provenance --access public
        working-directory: npm/ime-linux-arm64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Linux ARMv7 Package
        if: hashFiles('npm/ime-linux-armv7/ime') != ''
        run: npm publish --provenance --access public
        working-directory: npm/ime-linux-armv7
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish macOS ARM64 Package
        if: hashFiles('npm/ime-macos-arm64/ime') != ''
        run: npm publish --provenance --access public
        working-directory: npm/ime-macos-arm64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish macOS x64 Package
        if: hashFiles('npm/ime-macos-x64/ime') != ''
        run: npm publish --provenance --access public
        working-directory: npm/ime-macos-x64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Windows Package
        if: hashFiles('npm/ime-win32-x64/ime.exe') != ''
        run: npm publish --provenance --access public
        working-directory: npm/ime-win32-x64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Main Package
        run: npm publish --provenance --access public
        working-directory: npm/ime-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
