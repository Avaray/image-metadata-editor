[package]
authors = ["Dawid Wasowski <contact@dav.one>"]
categories = ["command-line-utilities", "development-tools", "filesystem", "multimedia::images", "parsing"]
description = "A fast, lightweight CLI for reading, writing, and wiping metadata from image files."
edition = "2024"
homepage = "https://dav.one/image-metadata-editor/"
keywords = ["cli", "metadata", "exif", "image", "tool"]
license = "CC-BY-NC-4.0"
name = "ime"
readme = "README.md"
repository = "https://github.com/Avaray/image-metadata-editor"
rust-version = "1.88"
version = "2.0.0"

[dependencies]
arboard = { version = "3.6", default-features = false }
crc = "3.4"
crossterm = "0.29"
hex = "0.4"
json5 = "1.3"
lexopt = "0.3"
little_exif = "0.6"
miniz_oxide = "0.8"
nom-exif = { version = "3.8", default-features = false }
notify = "8.2"
ratatui = "0.30"
serde_json = "1.0"
tui-input = { version = "0.15", default-features = false, features = ["ratatui-crossterm"] }
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
