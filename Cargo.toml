[package]
authors = ["Dawid Wasowski <contact@dav.one>"]
categories = ["command-line-utilities", "multimedia::images", "development-tools", "multimedia", "utilities"]
description = "A fast, lightweight CLI for reading, writing, and wiping metadata from image files."
edition = "2024"
keywords = ["cli", "metadata", "exif", "image", "tool"]
license = "CC-BY-NC-4.0"
name = "ime"
repository = "https://github.com/Avaray/image-metadata-editor"
homepage = "https://github.com/Avaray/image-metadata-editor"
readme = "README.md"
rust-version = "1.85"
version = "1.0.0"

[dependencies]
crc = "3.4.0"
lexopt = "0.3.2"
little_exif = "0.6.23"
nom-exif = { version = "3", default-features = false }
serde_json = "1.0.151"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
